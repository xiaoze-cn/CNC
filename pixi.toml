[workspace]
name = "pcb-cnc-inspection"
version = "0.6.0"
description = "PCB and CNC inspection with structured-light scanning and a motorized turntable"
authors = ["Project contributors"]
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.12,<3.13"
pyserial = ">=3.5,<4"
pymodbus = ">=3.14,<4"
numpy = ">=2.0,<3"
pytorch = ">=2.5,<3"
pip = ">=25"
setuptools = ">=75"
wheel = ">=0.45"

[pypi-dependencies]
pillow = ">=12.3.0, <13"
opencv-python-headless = ">=5.0.0.93, <6"
gymnasium = ">=1.0,<2"

[target.win-64.pypi-dependencies]
PyRVC = "==1.15.0"
open3d-cuda = { url = "https://github.com/isl-org/Open3D/releases/download/main-devel/open3d_cuda-0.19.0%2B22a6a30-cp312-cp312-win_amd64.whl" }
cadquery-ocp = "==7.9.3.1.1"

[activation.env]
PYTHONPATH = "src"

[tasks]
inspect = "python -m main inspect"
trace = "python -m main trace"
merge = "python -m main merge"
show = "python -m main show"
compact = "python -m main compact"
doctor = "python -m main doctor"
